name: Release Rust crates

# Publishes the Rust workspace crates to crates.io.
#
#   - push of a tag matching rust-v*: verifies the workspace (fmt, clippy,
#     tests, docs gate, MSRV, packaged-crate self-containedness, tag/version
#     agreement) and then publishes every workspace crate version that is not
#     yet on crates.io, in dependency order (core -> alias -> cli). Already
#     published versions are skipped, so a partially failed run can be retried
#     safely.
#   - workflow_dispatch: runs the verification suite only (a release dry run).
#
# Authentication uses crates.io Trusted Publishing (OIDC): the repository is
# configured on crates.io as a trusted publisher for each crate with this
# workflow filename, and rust-lang/crates-io-auth-action exchanges the
# GitHub-issued JWT for a 30-minute publish token. No long-lived registry
# token is stored in the repository. Note that a brand-new crate cannot be
# created this way: its first version is published manually by an owner, and
# the Trusted Publisher configuration is added afterwards.

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:

# Least privilege: verification needs nothing beyond the checkout, and the
# publish job's OIDC grant is declared on the job itself.
permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify workspace before publishing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchains (stable + MSRV)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.77 --profile minimal
      - name: Tag and workspace versions must agree
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          want="${GITHUB_REF_NAME#rust-v}"
          for crate in lorentzian-classification-core lorentzian-classification lorentzian-classification-cli; do
            have="$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')"
            if [ "$have" != "$want" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} wants version ${want}, but ${crate} is ${have}."
              exit 1
            fi
          done
          echo "All workspace crates are at ${want}."
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (release, committed gold baselines)
        run: cargo test --workspace --release
      - name: Test without default features (zero-dependency core)
        run: cargo test -p lorentzian-classification-core --no-default-features
      - name: Docs (rustdoc warnings and missing docs denied)
        run: RUSTDOCFLAGS='-D warnings -D missing_docs' cargo doc --workspace --no-deps
      - name: MSRV check with the committed lockfile
        run: |
          cargo +1.77 check --workspace --locked
          cargo +1.77 check -p lorentzian-classification-core --no-default-features --locked
      - name: Package the core crate and test it outside the workspace
        run: |
          cargo package -p lorentzian-classification-core
          crate_file="$(ls target/package/lorentzian-classification-core-*.crate)"
          tar -xzf "$crate_file" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/lorentzian-classification-core-*/
          cargo test

  publish:
    name: Publish to crates.io (Trusted Publishing)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for crates.io Trusted Publishing (OIDC).
    defaults:
      run:
        working-directory: ports/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish unpublished crate versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#rust-v}"
          for crate in lorentzian-classification-core lorentzian-classification lorentzian-classification-cli; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "User-Agent: ${GITHUB_REPOSITORY} release workflow" \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$status" = "200" ]; then
              echo "${crate} ${version} is already on crates.io; skipping."
              continue
            fi
            echo "Publishing ${crate} ${version}..."
            # cargo waits for the published version to be discoverable in the
            # index before returning, so dependents can publish right after.
            cargo publish -p "$crate"
          done
